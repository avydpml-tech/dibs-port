name: Build Android APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/3.4.4-stable/Godot_v3.4.4-stable_linux_headless.64.zip
          unzip Godot_v3.4.4-stable_linux_headless.64.zip
          mv Godot_v3.4.4-stable_linux_headless.64 godot
          chmod +x godot

      - name: Download Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/3.4.4-stable/Godot_v3.4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.4.4.stable
          unzip Godot_v3.4.4-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/templates/3.4.4.stable/

      - name: Build APK
        run: |
          mkdir -p ~/.config/godot
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo '[gd_resource type="EditorSettings"]
          [resource]
          export/android/android_sdk_path = "'$ANDROID_SDK_ROOT'"
          export/android/debug_keystore = "'$GITHUB_WORKSPACE'/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-3.tres
          ./godot --verbose --export "Android" game.apk --path $GITHUB_WORKSPACE 2>&1 | tee godot_export.log
          cat godot_export.log
          BUILDTOOLS=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)
          $BUILDTOOLS/zipalign -v -f 4 game.apk game_aligned.apk
          $BUILDTOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out game_signed.apk game_aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: game_signed.apk
